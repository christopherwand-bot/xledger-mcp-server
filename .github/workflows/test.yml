name: Test
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-nor
      - run: npm test
      - name: Build production PDF and OCR runtime
        run: docker build -t xledger-mcp-invoice-ci .
      - name: Verify OCR in production image
        run: |
          docker run --rm --entrypoint node -v "$PWD/tests/fixtures:/fixtures:ro" xledger-mcp-invoice-ci --input-type=module -e '
            import { readFile } from "node:fs/promises";
            import { readPdf } from "./dist/pdf-reader.js";
            const fixture = await readFile("/fixtures/scanned-invoice.pdf.base64", "utf8");
            const invoice = await readPdf(Buffer.from(fixture.trim(), "base64"), "NOK");
            if (invoice.pagesRead !== 1 || !invoice.text.toUpperCase().includes("SCANNED INVOICE") || invoice.status !== "needs_review") throw new Error("Native invoice OCR runtime failed");
            console.log("Production PDF/OCR runtime passed");
          '
